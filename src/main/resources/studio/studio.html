<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Quality Studio</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#17203a;--mute:#66708a;--line:#e3e7f1;--side:#0f1d3a;--side2:#16274d;--accent:#2f5bd8;--accent2:#e9efff;--pass:#0e8a4a;--fail:#d3322c;--warn:#c47a0a;--blk:#6b7280;--shadow:0 1px 2px rgba(20,32,70,.06),0 4px 14px rgba(20,32,70,.05)}
:root[data-theme=dark]{--bg:#0d1322;--card:#161e36;--ink:#e8ecf6;--mute:#9aa6c4;--line:#27315a;--side:#080e1c;--side2:#101933;--accent:#7aa2ff;--accent2:#1a2547;--shadow:none}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex}
button{font:inherit;cursor:pointer}a{color:var(--accent)}
.side{width:236px;background:var(--side);color:#cfd8f3;display:flex;flex-direction:column;flex-shrink:0}
.side .logo{padding:16px 18px;font-weight:800;font-size:16px;color:#fff;display:flex;gap:10px;align-items:center;text-decoration:none}.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b6cf0,#6a8cff);display:inline-block}
.side .proj{padding:0 14px 10px}.side .proj label{font-size:10.5px;letter-spacing:.09em;color:#7f8db5;text-transform:uppercase;display:block;margin:0 2px 4px}.side select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #2a3a69;background:var(--side2);color:#fff}
.nav{flex:1;overflow:auto;padding:4px 8px}.nav h6{margin:14px 10px 4px;font-size:10.5px;letter-spacing:.09em;color:#7f8db5;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#cfd8f3;text-decoration:none;cursor:pointer;font-size:13.5px}.nav a:hover{background:var(--side2)}.nav a.on{background:#2342a0;color:#fff}.nav a.dis{opacity:.45}
.nav a .n{margin-left:auto;font-size:11px;background:#25346a;border-radius:999px;padding:1px 8px}
.side .foot{padding:10px 14px;border-top:1px solid #1d2b57;font-size:12px;color:#8e9bc4}.side .foot button{background:transparent;border:1px solid #2a3a69;color:#cfd8f3;border-radius:7px;padding:4px 9px;margin-top:6px}
.content{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700}.top .sp{flex:1}.crumb{color:var(--mute);font-size:12px}
.btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;transition:border-color .12s,box-shadow .12s}.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.d{background:var(--fail);border-color:var(--fail);color:#fff}.btn:disabled{opacity:.45;cursor:default}.btn.sm{padding:3px 9px;font-size:12px}
.kbd{font:11px Consolas,monospace;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mute);background:var(--bg)}
.body{display:flex;flex:1;min-height:0}.main{flex:1;overflow:auto;padding:18px 22px;min-width:0}.lead{color:var(--mute);margin:-4px 0 14px;max-width:820px}
aside.chat{width:370px;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
aside.chat.off{display:none}aside.chat h2{margin:0;padding:11px 16px;font-size:14px;border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:12px 14px}.m{margin:0 0 10px;padding:9px 12px;border-radius:12px;word-wrap:break-word}.m.u{background:var(--accent);color:#fff;margin-left:30px}.m.a{background:var(--bg);border:1px solid var(--line)}
.m code{background:rgba(127,127,127,.18);padding:1px 4px;border-radius:4px;font-size:12px}.m ul,.m ol{margin:4px 0 4px 18px;padding:0}.src{font-size:11px;color:var(--mute);margin-top:6px}
.fu{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chip{padding:3px 11px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:12px;background:var(--card);color:var(--ink)}.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#ask{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}#ask input{flex:1}
input[type=text],input[type=search],input[type=url],select,textarea{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.kpi .v{font-size:28px;font-weight:800}.kpi small{color:var(--mute)}
.hero{background:linear-gradient(120deg,#1d3a8a,#3b6cf0);color:#fff;border:none}.hero h3{margin:0 0 4px}.hero .btn{margin-top:10px}.hero p{margin:0;opacity:.92}
.steps{display:flex;gap:6px;flex-wrap:wrap}.step{flex:1;min-width:110px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12.5px;cursor:pointer}
.step b{display:block;font-size:11px;color:var(--mute);text-transform:uppercase}.step.done{border-color:var(--pass);background:rgba(14,138,74,.07)}.step.done b{color:var(--pass)}.step.current{border-color:var(--accent);background:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600;white-space:nowrap;display:inline-block}.DRAFT{background:#8a93a8}.REVIEWED{background:#c47a0a}.APPROVED{background:#2f5bd8}.ACTIVE{background:#0e8a4a}.DEMO{background:#7c5cff}
.o-PASS{background:var(--pass)}.o-FAIL{background:var(--fail)}.o-BLOCKED{background:var(--blk)}.o-NOT_EXECUTED{background:#8a93a8}.o-SKIPPED{background:var(--warn)}
.sev-critical{background:#a4161a}.sev-high{background:#d3322c}.sev-medium{background:#c47a0a}.sev-low{background:#2f5bd8}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{font-size:11px;color:var(--mute);text-transform:uppercase;position:sticky;top:0;background:var(--card);z-index:1}th.s{cursor:pointer}th.s:hover{color:var(--accent)}
tr.t:hover{background:var(--accent2)}.mono{font-family:Consolas,monospace;font-size:12px;word-break:break-all}.mute{color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.empty{padding:38px;text-align:center;color:var(--mute)}.empty h3{color:var(--ink);margin:6px 0}
.prog{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.prog>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}.hbar .t{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .tr{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}.hbar .tr i{display:block;height:100%}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:flex-start;justify-content:center;z-index:40;padding-top:8vh;overflow:auto}.modal.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:22px 24px;max-width:94vw;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .15s ease-out}@keyframes pop{from{transform:translateY(8px)}}
.box label.l{display:block;margin:12px 0 4px;font-weight:600;font-size:12px}.box input[type=text],.box input[type=url],.box select{width:100%}
.dh{margin:0 0 6px;font-size:18px}.df{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.notice{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}.notice.warn{background:rgba(196,122,10,.12);border:1px solid rgba(196,122,10,.4)}.notice.info{background:var(--accent2)}.notice.bad{background:rgba(211,50,44,.1);border:1px solid rgba(211,50,44,.4)}.notice.ok{background:rgba(14,138,74,.1);border:1px solid rgba(14,138,74,.4)}
.wz{display:flex;gap:6px;margin:8px 0 14px}.wz span{flex:1;text-align:center;font-size:12px;padding:6px;border-radius:8px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}.wz span.on{background:var(--accent2);color:var(--accent);border-color:var(--accent);font-weight:700}.wz span.done{color:var(--pass);border-color:var(--pass)}
#pal{width:620px;padding:0;overflow:hidden}#pal input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px;background:var(--card)}#pal input:focus{outline:none}
#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}#pal li{padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}#pal li.sel{background:var(--accent2)}#pal li small{color:var(--mute);margin-left:auto}
#drawer{position:fixed;top:0;right:-680px;width:660px;max-width:100%;height:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.22);transition:right .2s;overflow:auto;padding:18px 22px;z-index:30}#drawer.open{right:0}
#drawer label{display:block;margin:10px 0 3px;font-weight:600;font-size:12px}#drawer input[type=text],#drawer select,#drawer textarea{width:100%}textarea{font-family:Consolas,monospace;font-size:12px;min-height:90px}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:9px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;font-size:12px}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0}.tabs2 span{padding:6px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent}.tabs2 span.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.runpill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--accent);background:var(--accent2);color:var(--accent);max-width:420px;white-space:nowrap}
.runpill i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}.runpill.done{border-color:var(--pass);background:rgba(14,138,74,.1);color:var(--pass)}.runpill.done i{animation:none}.runpill.otp{border-color:var(--warn);background:rgba(196,122,10,.14);color:var(--warn)}.runpill.bad{border-color:var(--fail);background:rgba(211,50,44,.1);color:var(--fail)}
.runpill .bar{width:70px;height:6px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden;display:inline-block}.runpill .bar b{display:block;height:100%;background:currentColor}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14284b;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:80;max-width:80vw}
.tip{border-bottom:1px dotted var(--mute);cursor:help}.dl{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.dl .ic{width:40px;height:48px;border-radius:7px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:12px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}@keyframes sk{to{background-position:-200% 0}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}.drop.hv{border-color:var(--accent);background:var(--accent2)}
.choice{cursor:pointer;border:2px solid var(--line);transition:border-color .12s,transform .12s}.choice:hover{border-color:var(--accent);transform:translateY(-2px)}.choice h3{margin:6px 0 4px}.choice .ic{width:42px;height:42px;border-radius:12px;background:var(--accent2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800}
.sc ol{margin:8px 0 12px 18px;padding:0}.sc li{margin:5px 0}
.con{background:#0b1020;color:#cfe3ff;font:12.5px/1.6 Consolas,"Cascadia Mono",monospace;border-radius:12px;padding:10px 12px;height:50vh;min-height:260px;overflow:auto;border:1px solid #1d2a55}.con div{white-space:pre-wrap;word-break:break-word;cursor:pointer;padding:0 5px;border-radius:4px}.con div:hover{background:#18213f}.con .P{color:#4ade80}.con .F{color:#ff7b7b}.con .B{color:#9aa3b8}.con .S{color:#fbbf24}.con .ct{color:#6f7da8}.con .cm{color:#8fb4ff}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}.live i{width:9px;height:9px;border-radius:50%;background:var(--pass);animation:pulse 1.2s infinite}.live.off i{background:var(--fail);animation:none}.live.idle i{background:var(--blk);animation:none}@keyframes pulse{50%{opacity:.25}}
@media(max-width:1100px){aside.chat{position:fixed;right:0;top:0;bottom:0;z-index:25;box-shadow:-10px 0 30px rgba(0,0,0,.25)}}
@media(max-width:820px){.side{width:62px}.side .logo span,.side .proj,.nav h6,.nav a span,.side .foot span{display:none}}
@media print{.side,.top,aside.chat{display:none}}
</style>

<body>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('aqs-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('aqs-'+k,JSON.stringify(v))}catch(e){}}};
let S={project:LS.get('project',null),view:'projects',data:null,ov:null,projects:[],sel:new Set(),f:{q:'',life:new Set(),cat:'',mod:'',out:''},sort:{k:'id',d:1},group:false,run:null,draft:false,reports:[],docs:[],hist:[],templates:[],cap:null,td:null,chk:null};
const GLOSS={DRAFT:'Generated or imported, not yet reviewed. Does not run by default.',REVIEWED:'Checked by a person, not yet approved.',APPROVED:'Approved to run.',ACTIVE:'Approved and part of the regular suite.',PASS:'The API behaved as expected.',FAIL:'A finding: the API behaved differently from the expectation or the rule pack.',BLOCKED:'Not sent: a prerequisite failed or credentials/values were missing. Not an API failure, but hides coverage.',NOT_EXECUTED:'Not eligible to run (draft, Run=N or unsupported body).'};
const NAV=[['1 - Get ready (after import)',[['overview','Overview and sign-in'],['endpoints','APIs'],['testdata','Test data'],['docs','Documents (optional)'],['capture','Record from browser']]],['2 - Build tests',[['tests','Tests'],['flow','Data flow'],['rules','Business rules'],['ideas','Test ideas']]],['3 - Run',[['live','Live run'],['load','Load test'],['automation','Automation and export']]],['4 - Results',[['reports','Reports'],['history','History']]],['Help',[['guide','How do I...?'],['help','Templates & glossary']]]];
const TITLES={projects:'Home - start here',overview:'Overview',tests:'Tests',endpoints:'APIs',flow:'Data flow',automation:'Automation',rules:'Business rules',ideas:'Test ideas',load:'Load test',testdata:'Test data',docs:'Documents',capture:'Record from browser',live:'Live run',reports:'Reports',history:'History',guide:'How do I...?',help:'Templates & glossary'};
const LEAD={overview:'Your project at a glance: what to do next, where the application under test is, and how healthy the last run was.',tests:'Every test in this project. A test runs only when it is Approved or Active. Tick rows to approve, run or delete them.',endpoints:'The APIs found in your file. "Generate tests" creates negative and security tests for one API.',
 flow:'Which API produces the value another API needs (an id, a reference number). Studio finds them, you approve them, runs follow the order: set up, test, clean up.',
 ideas:'More test ideas beyond the standard set: built in (they use the meaning of each field) and, if you switch the AI engine on, proposed by a language model. Nothing is added until you approve it.',
 load:'Measure how the API behaves under many users at once: throughput, response-time percentiles and errors, with pass/fail limits. Safe by design: read-only requests by default, hard limits, automatic stop when the target starts failing.',
 rules:'Rules written in your requirement document become tests you can review. Nothing is created until you approve it, and anything unclear is shown for you to settle.',
 automation:'Run on a schedule or from your build pipeline (Jenkins, GitHub Actions, Azure DevOps, Windows Task Scheduler), with pass/fail exit codes and JUnit results.',
 testdata:'Valid data is what every test is built from. Download the workbook, fill it in, upload it back.',docs:'Optional. A business document (BRD) helps the assistant understand your flows and rules. The product works without one.',capture:'Optional. Record the API calls your real web application makes while you use it, then compare them with this project.',
 live:'Every request, as it is sent. Opens by itself when a run starts.',reports:'Every run creates HTML, Excel, PDF and VAPT reports. Open them here or share the files.',history:'An audit trail of every change and every run in this project.',guide:'Step-by-step help for a brand-new API, for a project already in Studio, and for the demo.',help:'Downloads and plain-language meanings of the words used in Studio.'};

// ---------- infrastructure
const th=document.documentElement;th.dataset.theme=LS.get('theme','light');
$('#theme').onclick=()=>{th.dataset.theme=th.dataset.theme==='dark'?'light':'dark';LS.set('theme',th.dataset.theme)};
async function api(path,body){const o=body===undefined?{}:{method:'POST',headers:{'X-Studio':'1','Content-Type':'application/json'},body:JSON.stringify(body)};
  const r=await fetch(path,o);const j=await r.json().catch(()=>({error:'bad response'}));if(r.status===401&&j.error==='login required'){showLogin();throw new Error('Please sign in')}if(!r.ok)throw new Error(j.error||r.status);return j}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}
function md(s){let h=esc(s);h=h.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');let out='',list=null;
  for(const l of h.split('\n')){const m=l.match(/^\s*(-|\d+\.)\s+(.*)/);if(m){const t=m[1]==='-'?'ul':'ol';if(list!==t){if(list)out+='</'+list+'>';out+='<'+t+'>';list=t}out+='<li>'+m[2]+'</li>'}
    else{if(list){out+='</'+list+'>';list=null}out+=l.trim()?'<div>'+l+'</div>':'<div style="height:6px"></div>'}}if(list)out+='</'+list+'>';return out}

window.editCredentials=async()=>{let c;try{c=await api('/api/project/'+S.project+'/credentials')}catch(e){toast(e.message);return}S.cred=c;const start=c.type!=='none'?c.type:(c.suggestedLoginEndpointId&&!c.selfSigned?'login':'none');

function demoCard(){return '<div class="card" style="margin-top:14px"><b>Demo walkthrough</b><div class="steps" style="margin-top:8px">'+[['1. Look around','See the APIs and the tests that already exist.',"go('endpoints')"],['2. Generate','Let the assistant create negative and security tests.',"ask('Generate negative and security tests from the positive tests')"],['3. Run','Run everything and build the reports.',"assess()"],['4. Read the VAPT','Open the security report after the run.',"go('reports')"]].map(s=>'<div class="step" onclick="'+s[2]+'"><b>'+s[0]+'</b>'+s[1]+'</div>').join('')+'</div></div>'}
const OC={PASS:'#0e8a4a',FAIL:'#d3322c',BLOCKED:'#6b7280',SKIPPED:'#c47a0a',NOT_EXECUTED:'#a9b0c2'};
function donut(c){const keys=Object.keys(c),tot=keys.reduce((a,k)=>a+c[k],0);if(!tot)return'<div class="mute">No data</div>';let a0=0,paths='';const R=52,r=32;
  keys.forEach(k=>{const frac=c[k]/tot,a1=a0+frac*2*Math.PI,l=frac>.5?1:0,p=(a,rr)=>[60+rr*Math.sin(a),60-rr*Math.cos(a)];if(frac>=.9999){paths+='<circle cx="60" cy="60" r="'+(R+r)/2+'" fill="none" stroke="'+OC[k]+'" stroke-width="'+(R-r)+'"/>'}else{const[x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);paths+='<path d="M'+x0+' '+y0+' A'+R+' '+R+' 0 '+l+' 1 '+x1+' '+y1+' L'+x2+' '+y2+' A'+r+' '+r+' 0 '+l+' 0 '+x3+' '+y3+' Z" fill="'+OC[k]+'"><title>'+k+': '+c[k]+'</title></path>'}a0=a1});

function sevBars(v){const s=v.severity,mx=Math.max(1,...Object.values(s));const col={critical:'#a4161a',high:'#d3322c',medium:'#c47a0a',low:'#2f5bd8'};
  return '<div style="margin-top:8px">'+Object.keys(s).map(k=>'<div class="hbar"><span class="t">'+k+'</span><span class="tr"><i style="width:'+(100*s[k]/mx)+'%;background:'+col[k]+'"></i></span><b>'+s[k]+'</b></div>').join('')+'</div>'+
  (v.findings.length?'<div style="margin-top:8px">'+v.findings.map(f=>'<div style="font-size:12.5px"><span class="pill sev-'+f.severity+'">'+f.severity+'</span> '+esc(f.title)+' <span class="mute">('+f.endpoints+' APIs)</span></div>').join('')+'</div>':'<div class="mute" style="margin-top:8px">No automated finding in this run ('+v.securityTests+' security tests executed).</div>')}
function modBars(ms){if(!ms.length)return'<div class="mute">No data</div>';return ms.slice(0,12).map(m=>{const tot=m.pass+m.fail+m.blocked||1;return '<div class="hbar"><span class="t" title="'+esc(m.name)+'">'+esc(m.name)+'</span><span class="tr"><i style="width:'+(100*m.pass/tot)+'%;background:var(--pass)"></i><i style="width:'+(100*m.fail/tot)+'%;background:var(--fail)"></i><i style="width:'+(100*m.blocked/tot)+'%;background:#a9b0c2"></i></span><b>'+(m.passRate<0?'-':m.passRate+'%')+'</b></div>'}).join('')}

window.act=a=>{if(a==='import')openWizard();else if(a==='testdata')go('testdata');else if(a==='generate')ask('Generate negative and security tests from the positive tests');else if(a==='assess')assess();
  else if(a==='tests-draft'){S.f.life=new Set(['DRAFT','REVIEWED']);go('tests')}else if(a==='blocked'){S.f.out='BLOCKED';go('tests')}else if(a==='failures'){S.f.out='FAIL';go('tests')}else if(a==='docs')go('docs');else if(a==='reports')go('reports')};

// ---------- tests
const SORTS={id:t=>t.id,title:t=>t.title||'',category:t=>t.category,lifecycle:t=>t.lifecycle,version:t=>t.version,last:t=>(S.data.last[t.id]||{}).outcome||''};
function filtered(){const d=S.data,f=S.f,q=f.q.toLowerCase(),epm={};d.endpoints.forEach(e=>epm[e.id]=e);
  let rows=d.tests.filter(t=>{const e=epm[t.endpointId]||{},l=d.last[t.id];return(!q||(t.id+' '+t.title+' '+t.category+' '+(e.path||'')+' '+(e.name||'')).toLowerCase().includes(q))&&(!f.life.size||f.life.has(t.lifecycle))&&(!f.cat||t.category===f.cat)&&(!f.mod||e.module===f.mod)&&(!f.out||(l&&l.outcome===f.out))});
  const fn=SORTS[S.sort.k];rows.sort((a,b)=>{const x=fn(a),y=fn(b);return(x>y?1:x<y?-1:0)*S.sort.d});return{rows,epm}}
function testsView(){const d=S.data,f=S.f,{rows,epm}=filtered(),mods=[...new Set(d.endpoints.map(e=>e.module))].sort(),cats=[...new Set(d.tests.map(t=>t.category))].sort(),lc={};d.tests.forEach(t=>lc[t.lifecycle]=(lc[t.lifecycle]||0)+1);
  const oc={};Object.values(d.last).forEach(l=>oc[l.outcome]=(oc[l.outcome]||0)+1);
  let h='<div class="bar"><input type="search" id="fq" placeholder="Search id, title, API, category..." value="'+esc(f.q)+'" style="min-width:280px">'+
   ['DRAFT','REVIEWED','APPROVED','ACTIVE'].map(l=>'<span class="chip '+(f.life.has(l)?'on':'')+'" data-l="'+l+'" title="'+esc(GLOSS[l])+'">'+l+' '+(lc[l]||0)+'</span>').join('')+
   '<select id="fcat"><option value="">All categories</option>'+cats.map(c=>'<option '+(f.cat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><select id="fmod"><option value="">All modules</option>'+mods.map(c=>'<option '+(f.mod===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'+
   ['PASS','FAIL','BLOCKED'].filter(k=>oc[k]).map(k=>'<span class="chip '+(f.out===k?'on':'')+'" data-o="'+k+'" title="'+esc(GLOSS[k])+'">'+k.toLowerCase()+' '+oc[k]+'</span>').join('')+
   (f.q||f.life.size||f.cat||f.mod||f.out?'<button class="btn" id="fclr">Clear filters</button>':'')+'<span style="flex:1"></span><label class="mute"><input type="checkbox" id="grp" '+(S.group?'checked':'')+'> group by module</label></div>';
  h+='<div class="card" style="padding:10px 14px;margin-bottom:12px;position:sticky;top:-18px;z-index:3"><div class="bar" style="margin:0"><b id="selc">'+S.sel.size+' selected</b><button class="btn" onclick="bulk(\'REVIEWED\')" title="Mark as checked by a person">Mark reviewed</button><button class="btn" onclick="bulk(\'APPROVED\')" title="Allow these tests to run">Approve</button><button class="btn" onclick="bulk(\'ACTIVE\')" title="Add to the regular suite">Activate</button><button class="btn" onclick="bulk(\'DRAFT\')">Back to draft</button><button class="btn" onclick="bulk(\'DELETE\')">Delete</button>'+
   '<span style="flex:1"></span><button class="btn" title="Derive negative and security tests from the positive tests and data" onclick="ask(\'Generate negative and security tests from the positive tests\')">Generate negatives</button><label class="mute"><input type="checkbox" id="idr" '+(S.draft?'checked':'')+'> include drafts</label><button class="btn" onclick="runTests(true)">Run selected</button><button class="btn" onclick="runTests(false)" title="Run every Approved / Active test (no new tests are generated)">Run approved</button></div></div><div id="runbox"></div>';
  if(!rows.length)return h+'<div class="card empty"><h3>No tests match</h3>'+(d.tests.length?'Clear the filters, or ask the assistant to generate tests.':'Create a project or ask the assistant to generate tests.')+'</div>';
  const thh=(k,l)=>'<th class="s" data-s="'+k+'" aria-sort="'+(S.sort.k===k?(S.sort.d>0?'ascending':'descending'):'none')+'">'+l+(S.sort.k===k?(S.sort.d>0?' &#9650;':' &#9660;'):'')+'</th>';
  const head='<thead><tr><th><input type="checkbox" id="all" aria-label="Select all"></th>'+thh('id','ID')+thh('title','Test')+thh('category','Category')+thh('lifecycle','State')+thh('version','v')+'<th>Origin</th>'+thh('last','Last run')+'</tr></thead>';
  const row=t=>{const l=d.last[t.id],e=epm[t.endpointId]||{};return '<tr class="t"><td><input type="checkbox" class="ck" data-id="'+esc(t.id)+'" '+(S.sel.has(t.id)?'checked':'')+' aria-label="Select '+esc(t.id)+'"></td><td class="mono" style="cursor:pointer" onclick="openTest(\''+esc(t.id)+'\')">'+esc(t.id)+'</td><td style="cursor:pointer" onclick="openTest(\''+esc(t.id)+'\')">'+esc(t.title)+'<div class="mute mono">'+esc(e.method||'')+' '+esc(e.path||'')+'</div></td><td>'+esc(t.category)+'</td><td>'+pill(t.lifecycle)+'</td><td>'+t.version+'</td><td>'+esc(t.origin)+'</td><td>'+(l?'<span style="cursor:pointer" onclick="openResult(\''+esc(t.id)+'\')">'+pill('o-'+l.outcome,l.outcome)+(l.http?' '+l.http:'')+'</span>':'<span class="mute">-</span>')+'</td></tr>'};
  const shown=rows.slice(0,800);
  if(S.group){const g={};shown.forEach(t=>{const m=(epm[t.endpointId]||{}).module||'General';(g[m]=g[m]||[]).push(t)});h+=Object.keys(g).sort().map(m=>'<details class="card" style="margin-bottom:10px;padding:8px 14px" open><summary style="cursor:pointer;font-weight:700">'+esc(m)+' <span class="mute">'+g[m].length+' tests</span></summary><table>'+head+'<tbody>'+g[m].map(row).join('')+'</tbody></table></details>').join('')}
  else h+='<div class="card" style="padding:4px 8px"><table>'+head+'<tbody>'+shown.map(row).join('')+'</tbody></table></div>';
  return h+(rows.length>800?'<div class="mute" style="margin-top:8px">Showing 800 of '+rows.length+'. Use the filters.</div>':'')}
function wireTests(){const f=S.f;$('#fq').oninput=e=>{f.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#fq');i.focus();i.setSelectionRange(p,p)};
  $$('[data-l]').forEach(c=>c.onclick=()=>{f.life.has(c.dataset.l)?f.life.delete(c.dataset.l):f.life.add(c.dataset.l);render()});$$('[data-o]').forEach(c=>c.onclick=()=>{f.out=f.out===c.dataset.o?'':c.dataset.o;render()});
  $('#fcat').onchange=e=>{f.cat=e.target.value;render()};$('#fmod').onchange=e=>{f.mod=e.target.value;render()};const cl=$('#fclr');if(cl)cl.onclick=()=>{S.f={q:'',life:new Set(),cat:'',mod:'',out:''};render()};
  $('#grp').onchange=e=>{S.group=e.target.checked;render()};$('#idr').onchange=e=>S.draft=e.target.checked;const all=$('#all');if(all)all.onchange=e=>{filtered().rows.forEach(t=>e.target.checked?S.sel.add(t.id):S.sel.delete(t.id));render()};
  $$('.ck').forEach(c=>c.onchange=e=>{e.target.checked?S.sel.add(c.dataset.id):S.sel.delete(c.dataset.id);$('#selc').textContent=S.sel.size+' selected'});$$('th.s').forEach(t=>t.onclick=()=>{S.sort=S.sort.k===t.dataset.s?{k:t.dataset.s,d:-S.sort.d}:{k:t.dataset.s,d:1};render()});if(S.run)showRun()}
window.bulk=async a=>{if(!S.sel.size){toast('Tick some tests first');return}
  if(a==='DELETE'){const ok=await confirmDlg('Delete '+S.sel.size+' tests?','Only DRAFT and REVIEWED tests can be deleted. Approved and active tests are kept. This cannot be undone.','Delete',true);if(!ok)return}
  try{const r=await api('/api/project/'+S.project+'/bulk',{ids:[...S.sel],action:a});toast(r.changed+' changed'+(r.skipped.length?', '+r.skipped.length+' skipped: '+r.skipped[0]:''));S.sel.clear();await loadProject();render()}catch(e){toast(e.message)}};
window.openTest=id=>{const t=S.data.tests.find(x=>x.id===id),e=S.data.endpoints.find(x=>x.id===t.endpointId)||{};
  $('#drawer').innerHTML='<div style="display:flex;justify-content:space-between"><h3 style="margin:0">'+esc(t.id)+' '+pill(t.lifecycle)+' <span class="mute">v'+t.version+'</span></h3><button class="btn" onclick="closeDrawer()">Close</button></div><div class="mute mono">'+esc(e.method||'')+' '+esc(e.path||'')+' - '+esc(e.module||'')+'</div>'+
  '<div class="tabs2"><span class="on" data-d="def">Definition</span><span data-d="res">Last result</span></div><div id="dbody"></div>';
  const body=$('#dbody'),def=()=>{body.innerHTML='<label>Title</label><input type="text" id="eTitle" value="'+esc(t.title)+'"><label>Category</label><input type="text" id="eCat" value="'+esc(t.category)+'">'+
  '<label>Expected HTTP status (comma separated; empty = rule pack default)</label><input type="text" id="eSt" value="'+esc((t.expected.status||[]).join(', '))+'">'+
  '<label>Assertions (JSON list: jsonPathExists / jsonPathEquals / maxLatencyMs / bodyNotContains)</label><textarea id="eAs">'+esc(JSON.stringify(t.expected.assertions||[],null,2))+'</textarea>'+
  '<label>Mutation (JSON: removeHeaders, setHeaders, removeBodyFields, setBodyFields, removeQuery, setQuery, method, path)</label><textarea id="eMu">'+esc(JSON.stringify(t.mutation||null,null,2))+'</textarea>'+
  '<label>Tags</label><input type="text" id="eTg" value="'+esc((t.tags||[]).join(', '))+'">'+(t.basedOn?'<p class="mute">Derived from positive test <b>'+esc(t.basedOn)+'</b>.</p>':'')+
  '<p class="mute" style="font-size:12px">Changing category, expected result or mutation of a reviewed/approved test creates a new version and sends it back to DRAFT.</p><button class="btn p" onclick="saveTest(\''+esc(id)+'\')">Save</button> <button class="btn" onclick="dismissTest(\''+esc(id)+'\')">Do not suggest this again</button> <button class="btn" onclick="ask(\'Why did '+esc(id)+' fail?\')">Ask the assistant</button>'};
  def();$$('#drawer .tabs2 span').forEach(s=>s.onclick=async()=>{$$('#drawer .tabs2 span').forEach(x=>x.classList.toggle('on',x===s));if(s.dataset.d==='def')def();else{body.innerHTML='<div class="skel"></div>';resultBody(id,body)}});$('#drawer').classList.add('open')};
async function resultBody(id,body){try{const r=await api('/api/project/'+S.project+'/result/'+encodeURIComponent(id));body.innerHTML='<p>'+pill('o-'+r.outcome,r.outcome)+' HTTP '+(r.httpStatus==null?'-':r.httpStatus)+' expected '+esc((r.expectedStatus||[]).join(', ')||'-')+' - '+r.latencyMs+' ms</p><p>'+esc(r.remark||'')+'</p>'+
  '<div class="mute">Call</div><div class="mono">'+esc(r.method||'')+' '+esc(r.url||'')+'</div><h4>Request (redacted)</h4><pre>'+esc(r.requestEvidence||'-')+'</pre><h4>Response (redacted)</h4><pre>'+esc(r.responseEvidence||'-')+'</pre>'+(r.owasp?'<p class="mute">Reference: '+esc(r.owasp)+'</p>':'')+'<button class="btn" onclick="ask(\'Why did '+esc(id)+' fail?\')">Ask the assistant</button> <button class="btn p" onclick="explainTest(\''+esc(id)+'\')">Explain in plain English</button><div id="exBox" style="margin-top:10px"></div>'}catch(e){body.innerHTML='<div class="empty">No result for this test in the latest run.</div>'}}
window.openResult=id=>{openTest(id);const s=$$('#drawer .tabs2 span')[1];if(s)s.click()};
window.saveTest=async id=>{try{const st=$('#eSt').value.split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));const body={title:$('#eTitle').value,category:$('#eCat').value.trim(),expected:{status:st,assertions:JSON.parse($('#eAs').value||'[]')},mutation:JSON.parse($('#eMu').value||'null'),tags:$('#eTg').value.split(',').map(x=>x.trim()).filter(Boolean)};
  await api('/api/project/'+S.project+'/test/'+encodeURIComponent(id),body);toast('Saved');closeDrawer();await loadProject();render()}catch(e){toast('Cannot save: '+e.message)}};
window.dismissTest=async id=>{const t=S.data.tests.find(x=>x.id===id);await api('/api/feedback',{kind:'dismiss',project:S.project,endpointId:t.endpointId,category:t.category});toast('Noted: '+t.category+' will not be suggested again for that API')};

// ---------- running + assessment dialog
window.runTests=async sel=>{try{const ids=sel?[...S.sel]:[];if(sel&&!ids.length){toast('Tick some tests first');return}const r=await api('/api/project/'+S.project+'/run',{ids,includeDraft:S.draft});openLive(r.runId,r.total)}catch(e){toast(e.message)}};
async function pollRun(){const r=await api('/api/run/'+S.run.id);S.run=Object.assign(S.run,r);showRun();if(r.state==='RUNNING')setTimeout(pollRun,900);else{await loadProject();render();showRun();if(r.state==='DONE')toast('Run finished - reports are ready under Reports')}}
function showRun(){const b=$('#runbox');if(!b||!S.run)return;const r=S.run,pct=r.total?Math.round(100*(r.done||0)/r.total):0;
  b.innerHTML='<div class="card" style="margin-bottom:12px"><div class="prog"><div style="width:'+pct+'%"></div></div><div>'+(r.state==='RUNNING'?'<b>Running</b> ':'<b>'+r.state+'</b> ')+(r.done||0)+' / '+r.total+' '+Object.keys(r.counts||{}).map(k=>pill('o-'+k,k+' '+r.counts[k])).join(' ')+' <span class="mute">'+esc(r.current||'')+'</span> '+(r.state==='RUNNING'?'<button class="btn" onclick="api(\'/api/run/'+r.id+'/cancel\',{})">Cancel</button>':'')+
   (r.htmlUrl?' <a class="btn" href="'+r.htmlUrl+'" target="_blank">Report</a> <a class="btn" href="'+r.excelUrl+'">Excel</a> <a class="btn" href="'+r.pdfUrl+'" target="_blank">PDF</a> <a class="btn" href="'+r.vaptUrl+'" target="_blank">VAPT</a> <a class="btn" href="'+r.vaptPdfUrl+'" target="_blank">VAPT PDF</a>':'')+(r.error?' <span style="color:var(--fail)">'+esc(r.error)+'</span>':'')+'</div></div>'}
window.assess=async()=>{try{if(!S.project){toast('Pick a project first - or start with the demo');return}if(!S.data)await loadProject();const o=S.ov,demo=o.source==='demo';
  if(S.cred&&S.cred.missing>0){const names=S.cred.references.filter(x=>!x.hasValue).map(x=>x.name).slice(0,6).join(', ');const go2=await dialog({title:'Credentials needed',width:560,okLabel:'Enter credentials',body:'<p>This project refers to <b>'+S.cred.missing+'</b> credential value(s) that are not set in this session: <span class="mono">'+esc(names)+'</span>.</p><p class="mute">Without them every protected API would answer 401 and the tests would be blocked. Values live in memory only (unless you tick Remember), so after Studio restarts they must be entered again.</p>'});if(go2)editCredentials();return}
  const v=await dialog({title:'Run full assessment',width:600,okLabel:'Start assessment',body:
   '<div class="notice info" style="margin-top:0">Studio will <b>(1)</b> derive negative and security tests from this project\'s valid tests and data, <b>(2)</b> approve everything that can run, <b>(3)</b> send the requests to the target below, <b>(4)</b> build HTML, Excel, PDF and VAPT reports.</div>'+
   '<label class="l">Target application URL</label><input type="url" id="aUrl" value="'+esc(o.baseUrl||'')+'" placeholder="https://qa-api.example.com">'+(demo?'<div class="notice ok">Demo target: a public sandbox. Safe to test.</div>':'')+
   '<div id="aProd" class="notice bad" style="display:none"><b>This looks like a production system.</b> Type <b>PRODUCTION</b> to confirm you have written approval and agreed conservative limits.<input type="text" id="aProdTxt" placeholder="PRODUCTION" style="width:100%;margin-top:6px"></div>'+
   '<div id="aPrev" class="notice info">Calculating how many requests will be sent...</div><label class="l">Options</label><label style="display:block"><input type="checkbox" id="aW"> Also generate data tests for create/update/delete APIs <span class="mute">(an accepted bad request could create junk records)</span></label><label style="display:block"><input type="checkbox" id="aL" checked> Include the 1 MB oversized-body test on read APIs</label>'+
   '<div class="notice warn"><label><input type="checkbox" id="aAuth"> <b>I am authorised to test this target</b> and I understand requests will be sent to it.</label></div>',
   onOpen:b=>{const pv=async()=>{const el=b.querySelector('#aPrev');try{const r=await api('/api/project/'+S.project+'/assess',{dryRun:true,includeWriteData:b.querySelector('#aW').checked,largePayload:b.querySelector('#aL').checked});
       const big=r.runnable>1500;el.className='notice '+(big?'warn':'info');el.innerHTML='<b>About '+r.runnable+' requests</b> will be sent ('+r.generated+' new negative/security tests will be generated from '+r.endpoints+' APIs).'+(big?' <b>That is a lot.</b> Consider testing a smaller project or only some modules first.':'')+(r.baseUrlResolved?'':' <b>The saved URL still contains a variable; enter the real URL above.</b>')}catch(e){el.className='notice bad';el.textContent='Could not calculate the preview: '+e.message}};
     pv();b.querySelector('#aW').onchange=pv;b.querySelector('#aL').onchange=pv},
   enable:b=>{const url=b.querySelector('#aUrl').value.trim(),prod=looksProd(url)&&!demo;b.querySelector('#aProd').style.display=prod?'block':'none';return /^https?:\/\/\S+/i.test(url)&&b.querySelector('#aAuth').checked&&(!prod||b.querySelector('#aProdTxt').value.trim()==='PRODUCTION')},
   collect:async b=>{const url=b.querySelector('#aUrl').value.trim();if(url!==o.baseUrl)await api('/api/project/'+S.project+'/target',{baseUrl:url,environment:o.environment});
     return{authorized:true,confirmProduction:looksProd(url)&&!demo,includeWriteData:b.querySelector('#aW').checked,largePayload:b.querySelector('#aL').checked}}});
  if(!v)return;const r=await api('/api/project/'+S.project+'/assess',v);toast(r.generated+' tests generated, '+r.approved+' approved - running now');await loadProject();openLive(r.runId,r.total)}catch(e){toast(e.message)}};
$('#assessBtn').onclick=()=>assess();

function synCard(){const s=S.syn;if(!s||!s.changes.length)return '<div class="card" style="margin-top:14px"><b>Fill empty sample fields</b><div class="mute">No empty or placeholder fields found in the valid requests.</div></div>';
  return '<div class="card" style="margin-top:14px"><b>Fill empty sample fields with safe synthetic data</b> <span class="mute">('+s.changes.length+' field(s) hold a placeholder such as "string" or are empty)</span><div class="mute" style="font-size:12.5px">Values are clearly artificial (example.test e-mail, sample formats), never real personal data. Passwords, tokens, user names and ids from other calls are never touched. Review, then apply.</div>'+

function loadView(){const c=S.loadc;if(!c)return '<div class="skel"></div>';if(c.err)return '<div class="notice bad">'+esc(c.err)+'</div>';
  if(S.load&&S.load.state)return loadLive();
  if(!c.tests.length)return '<div class="card empty"><h3>No valid requests yet</h3>Import an API first.</div>';
  const ro=c.tests.filter(t=>t.readOnly),wr=c.tests.filter(t=>!t.readOnly);
  return '<div class="card"><b>What to load test</b><div class="mute" style="font-size:12.5px">Each virtual user signs in on its own and repeats the ticked valid requests for the chosen time.</div><div style="max-height:220px;overflow:auto;margin:8px 0">'+ro.map((t,i)=>'<label style="display:block"><input type="checkbox" class="ldT" value="'+esc(t.id)+'" '+(i<3?'checked':'')+'> <span class="mono">'+esc(t.label)+'</span></label>').join('')+
   (wr.length?'<div class="mute" style="margin-top:8px">Create / update / delete requests (would create or change data):</div>'+wr.map(t=>'<label style="display:block"><input type="checkbox" class="ldT ldW" value="'+esc(t.id)+'"> <span class="mono">'+esc(t.label)+'</span></label>').join(''):'')+'</div>'+
   '<div class="grid g4"><div><label class="mute">Virtual users (1-100)</label><br><input type="text" id="ldU" value="5" style="width:90px"></div><div><label class="mute">Duration, seconds (5-600)</label><br><input type="text" id="ldD" value="30" style="width:90px"></div><div><label class="mute">Ramp-up, seconds</label><br><input type="text" id="ldR" value="5" style="width:90px"></div><div><label class="mute">Think time, ms</label><br><input type="text" id="ldK" value="200" style="width:90px"></div></div>'+
   '<div class="grid g4" style="margin-top:8px"><div><label class="mute">Limit: p95 latency (ms, 0 = off)</label><br><input type="text" id="ldP" value="2000" style="width:90px"></div><div><label class="mute">Limit: errors (%)</label><br><input type="text" id="ldE" value="5" style="width:90px"></div></div>'+
   '<div class="notice warn"><label><input type="checkbox" id="ldA"> <b>I am authorised to load test this target</b> (use a test environment, never a system real customers depend on).</label></div>'+
   '<div class="mute" style="font-size:12px">Studio stops automatically if more than half of the recent requests fail. Hard limits: 100 users, 10 minutes.</div><button class="btn p" style="margin-top:10px" onclick="loadStart()">Start load test</button></div>'}
window.loadStart=async()=>{try{const ids=$$('.ldT').filter(c=>c.checked).map(c=>c.value);if(!ids.length){toast('Tick at least one request');return}if(!$('#ldA').checked){toast('Confirm the authorisation first');return}
  const writes=$$('.ldW').some(c=>c.checked);if(writes&&!await confirmDlg('Load test with create/update/delete?','These requests will be repeated many times and create or change records in the target. Only continue on a throw-away test environment.','Continue',true))return;
  const prod=looksProd(S.ov&&S.ov.baseUrl)&&S.ov.source!=='demo';if(prod){const okp=await dialog({title:'Production target',okLabel:'Confirm',body:'<div class="notice bad"><b>This looks like production.</b> Load test it only with written approval. Type <b>PRODUCTION</b> to confirm.</div><input type="text" id="pcT" style="width:100%" autofocus>',enable:b=>b.querySelector('#pcT').value.trim()==='PRODUCTION',danger:true});if(!okp)return}
  const r=await api('/api/project/'+S.project+'/load',{authorized:true,confirmProduction:prod,includeWrites:writes,testIds:ids,users:+$('#ldU').value,durationSec:+$('#ldD').value,rampSec:+$('#ldR').value,thinkMs:+$('#ldK').value,p95Ms:+$('#ldP').value,maxErrorPct:+$('#ldE').value});S.load={id:r.loadId,state:'RUNNING',apis:[],series:[],verdict:[]};render();loadPoll()}catch(e){toast(e.message)}};
async function loadPoll(){const L=S.load;if(!L)return;try{const r=await api('/api/load/'+L.id);S.load=Object.assign(r,{id:L.id});if(S.view==='load')render();if(r.state==='RUNNING')setTimeout(loadPoll,1000);else toast('Load test finished: '+(r.passed?'thresholds met':'thresholds NOT met'))}catch(e){setTimeout(loadPoll,2000)}}
function loadLive(){const L=S.load,run=L.state==='RUNNING',c=L.config||{},sec=Math.max(1,Math.round(((L.finishedAt||Date.now())-L.startedAt)/1000));
  const kp=(l,v,col)=>'<div><div class="mute" style="font-size:11px;text-transform:uppercase">'+l+'</div><div style="font-size:20px;font-weight:800;color:'+(col||'inherit')+'">'+v+'</div></div>';
  let h='<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+(run?'<span class="live"><i></i>LIVE</span>':'<span class="live idle"><i></i>'+esc(L.state)+'</span>')+'<b>'+(run?'Load test running':L.passed?'Passed':'Failed')+'</b><span class="mute mono">'+esc(L.baseUrl||'')+'</span><span style="flex:1"></span>'+(run?'<button class="btn d" onclick="api(\'/api/load/'+L.id+'/cancel\',{})">Stop</button>':'<button class="btn" onclick="S.load=null;render()">New load test</button>')+(L.reportUrl?' <a class="btn p" target="_blank" href="'+L.reportUrl+'">Open report</a>':'')+'</div>'+
   '<div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:10px">'+kp('Users',(L.activeUsers||0)+' / '+(c.users||'-'))+kp('Requests',L.totalRequests||0)+kp('Errors',L.totalErrors||0,L.totalErrors?'var(--fail)':'')+kp('Throughput',((L.totalRequests||0)/sec).toFixed(1)+'/s')+kp('Elapsed',sec+' s / '+(c.durationSec||'-')+' s')+'</div>'+(L.note?'<div class="notice bad">'+esc(L.note)+'</div>':'')+(L.error?'<div class="notice bad">'+esc(L.error)+'</div>':'')+
   (!run&&L.verdict&&L.verdict.length?'<div class="notice '+(L.passed?'ok':'bad')+'">'+L.verdict.map(esc).join('<br>')+'</div>':'')+'</div>';
  h+='<div class="card" style="margin-bottom:12px"><b>Throughput and latency</b>'+loadChart(L.series||[])+'</div>';
  h+='<div class="card"><b>Per API</b><table><thead><tr><th>API</th><th>Requests</th><th>Errors</th><th>Avg</th><th>p90</th><th>p95</th><th>p99</th><th>Max</th><th>req/s</th></tr></thead><tbody>'+(L.apis||[]).map(a=>'<tr><td class="mono">'+esc(a.api)+(a.lastError?'<div class="mute" style="font-size:12px">'+esc(a.lastError)+'</div>':'')+'</td><td>'+a.count+'</td><td style="color:'+(a.errors?'var(--fail)':'inherit')+'">'+a.errors+' ('+a.errorPct+'%)</td><td>'+a.avgMs+'</td><td>'+a.p90Ms+'</td><td style="font-weight:700;color:'+(a.thresholdFailed?'var(--fail)':'inherit')+'">'+a.p95Ms+'</td><td>'+a.p99Ms+'</td><td>'+a.maxMs+'</td><td>'+a.rps+'</td></tr>').join('')+'</tbody></table></div>';return h}
function loadChart(pts){if(pts.length<2)return '<div class="mute">Collecting data...</div>';const w=900,h=150,pad=26;let mr=1,ml=1;pts.forEach(p=>{mr=Math.max(mr,p.requests);ml=Math.max(ml,p.avgMs)});
  const a=pts.map((p,i)=>(pad+(w-2*pad)*i/(pts.length-1)).toFixed(1)+','+(h-pad-(h-2*pad)*p.requests/mr).toFixed(1)).join(' '),b=pts.map((p,i)=>(pad+(w-2*pad)*i/(pts.length-1)).toFixed(1)+','+(h-pad-(h-2*pad)*p.avgMs/ml).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="throughput and latency"><rect x="'+pad+'" y="'+pad+'" width="'+(w-2*pad)+'" height="'+(h-2*pad)+'" fill="none" stroke="var(--line)"/><polyline fill="none" stroke="#2f5bd8" stroke-width="2" points="'+a+'"/><polyline fill="none" stroke="#c47a0a" stroke-width="2" points="'+b+'"/><text x="'+pad+'" y="14" font-size="11" fill="#2f5bd8">requests/s (max '+mr+')</text><text x="230" y="14" font-size="11" fill="#c47a0a">average latency ms (max '+ml+')</text></svg>'}

// ---------- business rules
function rulesView(){const r=S.rules;if(!r)return '<div class="skel"></div>';if(r.err)return '<div class="notice bad">'+esc(r.err)+'</div>';
  if(!r.files.length)return '<div class="card empty"><h3>No requirement document yet</h3>Upload a BRD, API document or business rules (.docx .pdf .md .txt) under <b>Documents</b>. Write rules as sentences such as "BR-001: POST /customers - mobile is required and must be exactly 10 digits".<br><br><button class="btn p" onclick="go(\'docs\')">Open Documents</button></div>';
  const ready=r.proposals.filter(p=>p.status==='ready'),conf=r.proposals.filter(p=>p.status!=='ready');
  const eps=S.data.endpoints;const sel=p=>'<select class="rpE" data-i="'+p.id+'"><option value="">- choose the API -</option>'+eps.map(e=>'<option value="'+esc(e.id)+'" '+(e.id===p.endpointId?'selected':'')+'>'+esc(e.method+' '+e.path)+'</option>').join('')+'</select>';
  const row=p=>'<tr data-p="'+p.id+'"><td><input type="checkbox" class="rpck" data-i="'+p.id+'" '+(p.status==='ready'?'checked':'')+'></td><td class="mono">'+esc(p.ruleId||'-')+'</td><td>'+esc(p.preview)+'<div class="mute" style="font-size:12px">"'+esc(p.sentence)+'"</div>'+(p.ambiguities.length?'<div style="color:var(--warn);font-size:12px">'+p.ambiguities.map(esc).join('<br>')+'</div>':'')+'</td><td>'+sel(p)+'</td><td><input type="text" class="rpF" data-i="'+p.id+'" value="'+esc(p.field)+'" style="width:130px" placeholder="field"></td><td class="mono">'+esc(p.kind)+(p.value&&p.kind!=='RESPONSE_HAS'?'<div class="mute">'+esc(p.value)+'</div>':'')+'</td></tr>';
  const head='<thead><tr><th></th><th>Rule</th><th>What will be tested</th><th>API</th><th>Field</th><th>Kind</th></tr></thead>';
  window.RP=Object.fromEntries(r.proposals.map(p=>[p.id,p]));
  let h='<div class="bar"><span class="mute">Read from: '+r.files.map(esc).join(', ')+'</span><span style="flex:1"></span><button class="btn p" onclick="rulesApply()">Create tests from the ticked rules</button></div>';
  h+='<div class="card" style="margin-bottom:12px"><b>Ready ('+ready.length+')</b> <span class="mute">clear rule, API and field found</span>'+(ready.length?'<table>'+head+'<tbody>'+ready.map(row).join('')+'</tbody></table>':'<div class="mute">None.</div>')+'</div>';
  h+='<div class="card" style="margin-bottom:12px"><b>Needs your confirmation ('+conf.length+')</b> <span class="mute">choose the API and field, then tick the rule</span>'+(conf.length?'<table>'+head+'<tbody>'+conf.map(row).join('')+'</tbody></table>':'<div class="mute">None.</div>')+'</div>';
  if(r.unparsed.length)h+='<div class="card"><b>Rules Studio could not turn into a test ('+r.unparsed.length+')</b><div class="mute" style="font-size:12.5px">They are stated, but not precisely enough to test automatically. Rewrite them as measurable sentences, or add the test by hand.</div><ul>'+r.unparsed.map(u=>'<li style="font-size:12.5px">'+esc(u)+'</li>').join('')+'</ul></div>';
  return h}
window.rulesApply=async()=>{const sel=$$('.rpck').filter(c=>c.checked).map(c=>{const id=c.dataset.i,p=Object.assign({},window.RP[id]);p.endpointId=document.querySelector('.rpE[data-i="'+id+'"]').value;p.field=document.querySelector('.rpF[data-i="'+id+'"]').value.trim();return p});
  if(!sel.length){toast('Tick at least one rule');return}if(sel.some(p=>!p.endpointId)){toast('Choose the API for every ticked rule');return}
  try{const r=await api('/api/project/'+S.project+'/rules',{proposals:sel});toast(r.applied+' rule(s) applied'+(r.skipped?', '+r.skipped+' could not be applied':'')+'. New tests are DRAFT: review them under Tests.');await loadProject();S.f.life=new Set(['DRAFT']);go('tests')}catch(e){toast(e.message)}};

// ---------- automation
function fmtTs(t){return t?new Date(t).toLocaleString():'-'}
function automationView(){const sc=S.sched||[],a=S.auto;
  let h=exportCard()+'<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:260px"><b>Scheduled runs (while Studio is open)</b><div class="mute" style="font-size:12.5px">Runs the approved tests, builds all reports and writes the result to History. A run is skipped, with the reason, if credentials are missing or the address is not the API. Credentials kept in memory are lost when Studio restarts: tick <i>Remember on this PC</i> or use the command line below for unattended runs.</div></div><button class="btn p" onclick="schedAdd()">Add a schedule</button></div>';
  h+=sc.length?'<table style="margin-top:10px"><thead><tr><th>When</th><th>Next run</th><th>Last run</th><th>Result</th><th></th></tr></thead><tbody>'+sc.map(x=>'<tr><td><b>'+esc(x.label)+'</b></td><td>'+(x.enabled?fmtTs(x.nextRun):'<span class="mute">paused</span>')+'</td><td>'+fmtTs(x.lastRun)+'</td><td>'+esc(x.lastResult||'-')+'<div class="mute" style="font-size:12px">'+esc(x.lastNote||'')+'</div></td><td><button class="btn sm" onclick="schedToggle(\''+x.id+'\','+(!x.enabled)+')">'+(x.enabled?'Pause':'Resume')+'</button> <button class="btn sm" onclick="schedRemove(\''+x.id+'\')">Delete</button></td></tr>').join('')+'</tbody></table>':'<div class="mute" style="margin-top:10px">No schedule yet.</div>';
  h+='</div>';
  if(a){const miss=a.missingSecrets||[];h+='<div class="card" style="margin-bottom:14px"><b>Command line and build pipelines</b><p class="mute" style="font-size:12.5px;margin:4px 0">Runs without the Studio window. Exit codes: <span class="mono">0</span> passed, <span class="mono">1</span> findings or pass rate below the gate, <span class="mono">2</span> usage error, <span class="mono">3</span> target not reachable or not the API, <span class="mono">4</span> credentials missing. Secrets are read from environment variables'+(miss.length?': <span class="mono">'+esc(miss.join(', '))+'</span>':'')+'.</p><pre id="cliCmd">'+esc(a.command)+'</pre><button class="btn sm" onclick="copyText(\'cliCmd\')">Copy command</button></div>';
    h+='<div class="grid g2">'+Object.keys(a.files).map(n=>'<div class="card"><b>'+esc(n)+'</b> <button class="btn sm" style="float:right" onclick="copyText(\'cf-'+esc(n.replace(/\W/g,'_'))+'\')">Copy</button><pre id="cf-'+esc(n.replace(/\W/g,'_'))+'" style="max-height:220px">'+esc(a.files[n])+'</pre></div>').join('')+'</div>'}
  return h}
window.auditVerify=async()=>{try{const r=await api('/api/project/'+S.project+'/audit?verify=1');$('#auditV').innerHTML=r.ok?'<span style="color:var(--pass)"><b>Intact.</b></span> '+r.chained+' chained entries verified'+(r.legacy?', '+r.legacy+' older entries from before the chain (not verifiable)':'')+'.':'<span style="color:var(--fail)"><b>Chain broken</b> at line '+r.firstBrokenLine+' ('+r.broken+' entries affected).</span>'}catch(e){toast(e.message)}};
window.copyText=id=>{const t=document.getElementById(id).innerText;navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Select the text and copy it'))};
window.schedPost=async b=>{try{S.sched=await api('/api/project/'+S.project+'/schedule',b);render()}catch(e){toast(e.message)}};
window.schedToggle=(id,en)=>schedPost({action:'toggle',id,enabled:en});
window.schedRemove=async id=>{if(await confirmDlg('Delete this schedule?','Past results stay in History.','Delete',true))schedPost({action:'remove',id})};
window.schedAdd=async()=>{const v=await dialog({title:'Add a schedule',width:520,okLabel:'Add',body:'<label class="l">How often</label><select id="sK"><option value="daily">Every day</option><option value="weekly">Every week</option><option value="interval">Every few minutes / hours</option></select><div id="sB"></div><div class="notice info">Runs the <b>approved</b> tests only. New negative tests are never added or approved automatically.</div>',
   onOpen:b=>{const K=b.querySelector('#sK'),B=b.querySelector('#sB');const draw=()=>{const k=K.value;B.innerHTML=(k==='interval'?'<label class="l">Every (minutes)</label><input type="text" id="sE" value="60">':(k==='weekly'?'<label class="l">Day</label><select id="sD">'+['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>'<option>'+d+'</option>').join('')+'</select>':'')+'<label class="l">Time (24 hour, this PC)</label><input type="text" id="sT" value="02:00">')};K.onchange=draw;draw()},
   collect:b=>{const k=b.querySelector('#sK').value;return{action:'add',kind:k,time:k==='interval'?'00:00':b.querySelector('#sT').value.trim(),day:k==='weekly'?b.querySelector('#sD').value:'MON',everyMinutes:k==='interval'?parseInt(b.querySelector('#sE').value)||0:60}}});if(v)schedPost(v)};

// ---------- test ideas, explanations, code export
function ideasView(){const eps=S.data.endpoints.filter(e=>!['WS','GRPC'].includes(e.method));if(!S.ideaSel)S.ideaSel=new Set(eps.slice(0,5).map(e=>e.id));const ai=S.ai||{};
  let h='<div class="card" style="margin-bottom:12px"><b>1. Choose the APIs</b> <span class="mute">(up to 12 at a time; only APIs with a request body can get ideas)</span><div style="max-height:200px;overflow:auto;margin:8px 0">'+eps.map(e=>'<label style="display:block"><input type="checkbox" class="idE" value="'+esc(e.id)+'" '+(S.ideaSel.has(e.id)?'checked':'')+'> <span class="mono">'+esc(e.method+' '+e.path)+'</span> <span class="mute">'+esc(e.name||'')+'</span></label>').join('')+'</div>'+
   '<label style="display:block"><input type="checkbox" id="idAi" '+(ai.enabled&&ai.reachable?'':'disabled')+'> Also ask the AI model <span class="mute">'+(ai.enabled?(ai.reachable?'(model: '+esc(ai.activeModel)+'; slower, one API at a time)':'(switched on but not reachable: see AI engine in the left menu)'):'(off: switch it on under AI engine in the left menu)')+'</span></label>'+
   '<button class="btn p" style="margin-top:8px" onclick="ideasFind()">Find ideas</button></div><div id="ideaOut"></div>';return h}
window.ideasFind=async()=>{const ids=$$('.idE').filter(c=>c.checked).map(c=>c.value);if(!ids.length){toast('Tick at least one API');return}S.ideaSel=new Set(ids);const out=$('#ideaOut');out.innerHTML='<div class="card"><div class="skel"></div><div class="mute">Working... with the AI model this can take a minute per API.</div></div>';
  try{const r=await api('/api/project/'+S.project+'/ideas',{action:'find',endpointIds:ids,useAi:!!($('#idAi')&&$('#idAi').checked)});S.ideas=r.ideas;
    out.innerHTML='<div class="card"><b>2. Ideas ('+r.ideas.length+')</b> '+(r.aiMessage?'<div class="notice info">'+esc(r.aiMessage)+'</div>':'')+(r.ideas.length?'<table><thead><tr><th></th><th>API</th><th>Idea</th><th>Value</th><th>Why</th><th>From</th></tr></thead><tbody>'+r.ideas.map(i=>'<tr><td><input type="checkbox" class="idC" data-n="'+i.n+'" '+(i.duplicate?'disabled':'checked')+'></td><td class="mono">'+esc(i.endpoint)+'</td><td>'+esc(i.title)+(i.duplicate?' <span class="pill o-SKIPPED">already a test</span>':'')+'</td><td class="mono">'+esc(JSON.stringify(i.value))+'</td><td class="mute" style="font-size:12.5px">'+esc(i.reason)+'</td><td>'+pill(i.source.startsWith('AI')?'o-PASS':'o-BLOCKED',i.source)+'</td></tr>').join('')+'</tbody></table><button class="btn p" style="margin-top:8px" onclick="ideasAdd()">Add the ticked ideas as DRAFT tests</button>':'<div class="mute">No ideas for these APIs (they need a JSON request body with fields such as e-mail, mobile, amount ...).</div>')+'</div>'}catch(e){out.innerHTML='<div class="notice bad">'+esc(e.message)+'</div>'}};
window.ideasAdd=async()=>{const pick=$$('.idC').filter(c=>c.checked).map(c=>S.ideas.find(i=>String(i.n)===c.dataset.n)).filter(Boolean);if(!pick.length){toast('Tick at least one idea');return}
  try{const r=await api('/api/project/'+S.project+'/ideas',{action:'add',ideas:pick});toast(r.added+' DRAFT test(s) added. Review them under Tests.');await loadProject();S.f.life=new Set(['DRAFT']);go('tests')}catch(e){toast(e.message)}};
window.explainTest=async id=>{const box=$('#exBox');if(!box)return;box.innerHTML='<div class="skel"></div>';const ai=S.ai&&S.ai.enabled&&S.ai.reachable;
  try{const e=await api('/api/project/'+S.project+'/explain',{testId:id,useAi:!!ai});box.innerHTML='<div class="notice info" style="margin:0"><b>'+esc(e.headline)+'</b><div style="margin-top:6px"><b>Likely cause:</b> '+esc(e.cause)+'</div><div style="margin-top:6px"><b>What to do:</b> '+esc(e.fix)+'</div>'+(e.aiText?'<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><b>AI wording ('+esc(e.source)+'):</b> '+esc(e.aiText)+'</div>':'')+(e.aiNote?'<div class="mute" style="font-size:12px;margin-top:6px">'+esc(e.aiNote)+'</div>':'')+'</div>'}catch(x){box.innerHTML='<div class="notice bad">'+esc(x.message)+'</div>'}};
function exportCard(){const u='/api/project/'+encodeURIComponent(S.project)+'/export';return '<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:260px"><b>Export the tests as code</b><div class="mute" style="font-size:12.5px">Hand the approved and active tests to developers as runnable code. Secrets are never written; they are read from environment variables. WebSocket and gRPC tests are not exported.</div></div><label class="mute"><input type="checkbox" id="exDr"> include drafts</label><a class="btn" id="exK" href="'+u+'?format=karate" onclick="this.href=\''+u+'?format=karate\'+($(\'#exDr\').checked?\'&draft=1\':\'\')">Karate (.feature)</a><a class="btn p" id="exR" href="'+u+'?format=restassured" onclick="this.href=\''+u+'?format=restassured\'+($(\'#exDr\').checked?\'&draft=1\':\'\')">Rest Assured + TestNG</a></div></div>'}

// ---------- data flow
function flowView(){const f=S.flow;if(!f)return '<div class="skel"></div>';if(f.err)return '<div class="notice bad">'+esc(f.err)+'</div>';const ep=id=>{const e=S.data.endpoints.find(x=>x.id===id);return e?e.method+' '+e.path:id};
  let h='<div class="bar"><button class="btn p" onclick="flowAddAll()" '+(f.proposals.length?'':'disabled')+' title="Adds every detected link">Add all '+f.proposals.length+' detected link(s)</button><button class="btn" onclick="flowManual()">Add a link manually</button><span class="mute">'+f.links.length+' link(s) active</span></div>';
  if(f.proposals.length)h+='<div class="card" style="margin-bottom:12px"><b>Detected dependencies</b> <span class="mute">(from the specification, names and responses - review before adding)</span><table><thead><tr><th>Needs a value</th><th>From</th><th>Variable</th><th>Read from the response</th><th></th></tr></thead><tbody>'+f.proposals.map((p,i)=>'<tr><td class="mono">'+esc(ep(p.toEndpointId))+'<div class="mute">'+esc(p.where)+': '+esc(p.name)+'</div></td><td class="mono">'+esc(ep(p.fromEndpointId))+'</td><td class="mono">${'+esc(p.var)+'}</td><td class="mono" title="'+esc(p.jsonPath)+'">'+esc(p.jsonPath.split('|')[0])+(p.jsonPath.includes('|')?' <span class="mute">+'+(p.jsonPath.split('|').length-1)+' alternatives</span>':'')+'</td><td>'+pill(p.confidence==='high'?'o-PASS':'o-SKIPPED',p.confidence==='high'?'confirmed by spec':'name based guess')+' <button class="btn sm" onclick="flowAdd('+i+')">Add</button></td></tr>').join('')+'</tbody></table></div>';
  else h+='<div class="notice info">No further dependencies were detected. If one API needs a value that another API creates, use <b>Add a link manually</b>.</div>';

    b.querySelector('#dfFile').onchange=async e=>{file=e.target.files[0];if(!file)return;out.innerHTML='<div class="skel"></div>';try{show(await api('/api/project/'+S.project+'/drift',{filename:file.name,contentBase64:await b64(file)}))}catch(x){out.innerHTML='<div class="notice bad">'+esc(x.message)+'</div>'}}}})};
function endpointsView(){const d=S.data;return contractCard()+mockCard()+'<div class="card" style="margin-bottom:12px"><span class="mute">Application URL (base)</span> <b class="mono">'+esc((d.environments[0]||{}).baseUrl)+'</b> &nbsp; <span class="mute">source</span> '+esc(d.api.source.type)+' '+esc(d.api.source.ref||'')+'<div class="mute" style="font-size:12.5px;margin-top:6px">Every API is called at <b>Base URL + API path</b>. Variables such as <span class="mono">${api_base_url}</span> are filled in below. An API on another address, or a project that only has one full URL per API, can be set with <b>Edit address</b> on its row.</div></div>'+

  d.endpoints.map(e=>{const n=d.tests.filter(t=>t.endpointId===e.id).length;return '<tr><td>'+esc(e.module)+'</td><td><b>'+esc(e.method)+'</b></td><td class="mono" style="font-size:12px">'+(e.baseUrl?esc(e.baseUrl):'<span style="color:var(--warn)">not set</span>')+'</td><td class="mono" style="font-size:12px">'+esc(e.apiPath)+(e.unresolved?' <span class="pill o-SKIPPED" title="A variable in this address has no value in the project: set it in Test data (Variables) or edit the address.">variable missing</span>':'')+'</td><td>'+esc(e.name)+'</td><td>'+n+'</td><td>'+esc(e.auth||'')+'</td><td>'+(e.contract?pill('o-PASS','yes'):'<span class="mute">-</span>')+'</td><td style="white-space:nowrap"><button class="btn sm" onclick="editApiUrl(\''+esc(e.id)+'\')">Edit address</button> <button class="btn sm" onclick="ask(\'Generate negative and security tests for '+esc(e.id)+'\')">Generate tests</button></td></tr>'}).join('')+'</tbody></table></div>'+
  '<div class="mute" style="font-size:12.5px;margin:8px 2px">Columns: <b>Tests</b> = number of tests of that API. <b>Auth</b> = sign-in profile Studio applies (empty: the request brings its own token or needs none). <b>Contract</b> = whether a response schema from an OpenAPI/Swagger file is stored for checking.</div>'}
window.editApiUrl=async id=>{const e=S.data.endpoints.find(x=>x.id===id);if(!e)return;const pos=S.data.tests.filter(t=>t.endpointId===id&&t.category==='POSITIVE');
  const v=await dialog({title:'Edit address of this API',width:640,okLabel:'Save',body:'<p class="mute" style="margin-top:0"><b>'+esc(e.method)+'</b> '+esc(e.name||'')+'</p>'+
   '<label class="l">Paste a full URL (the easy way)</label><input type="text" id="eaFull" placeholder="https://host/path/to/api" value="'+esc(e.fullUrl||'')+'" autofocus><div class="mute" style="font-size:12px">Studio splits it into base URL and API path for you.</div>'+
   '<div class="grid g2" style="margin-top:6px"><div><label class="l">Base URL</label><input type="text" id="eaBase" value="'+esc(e.baseUrl||'')+'"></div><div><label class="l">API path</label><input type="text" id="eaPath" value="'+esc(e.apiPath||'')+'"></div></div>'+

     F.oninput=()=>{try{const u=new URL(F.value.trim());B.value=u.origin;P.value=(u.pathname==='/'&&!u.search?'/':u.pathname)+u.search}catch(x){}prev()};B.oninput=prev;P.oninput=prev;prev()},

  if(!v)return;try{await api('/api/project/'+S.project+'/endpoint',v);toast('Address saved');await loadProject();render();if(v.run&&pos.length){const r=await api('/api/project/'+S.project+'/run',{ids:pos.map(t=>t.id),includeDraft:true});openLive(r.runId,r.total)}}catch(x){toast(x.message)}};
function testdataView(){const o=S.ov;return '<div class="grid g2"><div class="card"><b>1. Download</b><p class="mute">One row per API with Method, Endpoint, Headers, Payload (JSON), ExpectedStatus, Extract, Set and Run, plus a Variables sheet. Pre-filled from your API.</p><a class="btn p" href="/api/project/'+encodeURIComponent(S.project)+'/testdata" download>Download '+esc(S.project)+'_testdata.xlsx</a>'+

function captureView(){const c=S.cap||{};return '<div class="card"><b>Record the real application</b><p>A separate browser window opens. <u>You</u> log in there (password, OTP and CAPTCHA are typed by you; Studio never sees them) and click through the flow. Studio records only API calls to the hosts you allow, masks tokens, cookies and passwords, and compares them with this project.</p>'+

document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}if(e.key==='Escape'){closeModals();return}if(typing||$('#dlgModal').classList.contains('on'))return;
  if(e.key==='/'){e.preventDefault();$('#chat').classList.remove('off');$('#q').focus()}else if(e.key==='?'){$('#kbModal').classList.add('on')}else if(e.key==='g'){gp=true;setTimeout(()=>gp=false,900)}else if(gp){gp=false;const m={o:'overview',t:'tests',r:'reports'}[e.key];if(m)go(m)}});
$$('.modal:not(#dlgModal)').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m&&m.id!=='wizModal')closeModals()}));

// ---------- start
(async function init(){try{const st=await api('/api/status');$('#ai').textContent=st.llmAvailable?'AI: rules + local model':'AI: built-in engine';$('#mode').textContent='- '+st.assistantMode.split('(')[0];await loadProjects();
  say('a','Hello! I work offline on your PC and answer from your project data. Pick a project, then ask for a summary, a failure explanation, or tests to add.');setFu(['What should I do first?','Is a BRD mandatory?','Where do I enter the application URL?']);
  const q=new URLSearchParams(location.search);history.replaceState(null,'',location.pathname);
  if(q.get('demo')){await startDemo();return}if(q.get('new')){render();openWizard();return}
  if(S.project&&S.projects.some(p=>p.name===S.project)){await selectProject(S.project,'overview')}else{S.project=null;render()}}catch(e){toast('Cannot reach the server: '+e.message)}})();
</script>
</body>
</html>
